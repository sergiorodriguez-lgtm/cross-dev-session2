name: Table Storage Backup CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      floci-az:
        image: floci/floci-az:latest
        ports:
          - 4577:4577
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider [http://127.0.0.1:4577/_floci/health](http://127.0.0.1:4577/_floci/health) || exit 1"          --health-interval 3s
          --health-timeout 4s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-data-tables

      - name: Provision Table Data via Azure CLI
        env:
          CONN_STR: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://127.0.0.1:4577/devstoreaccount1-table;"
        run: |
          az storage table create --name Users --connection-string "$CONN_STR"
          az storage entity insert --table-name Users --entity PartitionKey=pk1 RowKey=1 Name=Alice Status=Active --connection-string "$CONN_STR"
          az storage entity insert --table-name Users --entity PartitionKey=pk1 RowKey=2 Name=Bob Status=Pending --connection-string "$CONN_STR"

      - name: Run Python CSV Backup Script
        env:
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://127.0.0.1:4577/devstoreaccount1-table;"
        run: |
          python backup_table.py

      - name: Validate Output
        run: |
          cat users_backup.csv
