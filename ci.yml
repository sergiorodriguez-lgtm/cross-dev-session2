name: Table Storage Backup CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Spin up Floci-AZ as a service container
    services:
      floci-az:
        image: floci/floci-az:latest
        ports:
          - 4577:4577

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for Floci-AZ Health Check
      run: |
        while ! curl -s http://localhost:4577/_floci/health | grep '"status": "UP"'; do
          echo "Waiting for Floci-AZ to start..."
          sleep 1
        done

    - name: Provision Table Data via Azure CLI
      env:
        CONN_STR: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://localhost:4577/devstoreaccount1-table;"
      run: |
        az storage table create --name Users --connection-string "$CONN_STR"
        az storage entity insert --table-name Users --entity PartitionKey=pk1 RowKey=1 Name=Alice Status=Active --connection-string "$CONN_STR"
        az storage entity insert --table-name Users --entity PartitionKey=pk1 RowKey=2 Name=Bob Status=Pending --connection-string "$CONN_STR"

    - name: Run CSV Backup Script
      env:
        # Inject the Azurite-compatible connection string directly into the runner
        AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://localhost:4577/devstoreaccount1-table;"
      run: |
        python backup_table.py

    - name: Validate Output
      run: |
        cat users_backup.csv